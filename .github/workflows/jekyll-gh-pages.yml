# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Publish Interview Study Guide

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
    paths:
      - 'JobSearchCodeExamples/Interview Study Guide/**/*.md'
      
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: "./JobSearchCodeExamples/Interview Study Guide"
          destination: "./_site"
          
      - name: Fix Markdown links
        run: |
          chmod -R u+w ./_site
          find ./_site -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            sed -i -E 's/(href="[^"]*)\.md([^"]*")/\1.html\2/g' "$file"
          done
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
